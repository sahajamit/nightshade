<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Light page</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #ffffff; color: #202124; margin: 0; padding: 24px; }
  .card { background: #f1f3f4; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin: 12px 0; }
  a { color: #1a73e8; }
  .muted { color: #5f6368; }
  button { background: #1a73e8; color: white; border: 0; border-radius: 4px; padding: 8px 14px; }
</style></head>
<body>
  <h1 id="title">A bright page</h1>
  <p class="muted">Ordinary light site with no dark theme of its own.</p>
  <div class="card" id="card">Card text with a <a href="#">link</a>.</div>
  <button id="btn">Primary action</button>
  <p id="hideme">A promo banner the user wants gone.</p>
</body></html>
